name: Terraform Azure CI/CD

on:
  push:
    branches:
      - "feature/**"
      - "main"

  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  TF_WORKING_DIR: parent_module/dev

jobs:

  # ============================================================
  # FEATURE BRANCH
  #
  # feature/* push
  #
  #   |
  #   +--> Terraform fmt
  #   +--> Terraform init
  #   +--> Terraform validate
  #   +--> Terraform plan
  #   |
  #   +--> Create PR to main
  #
  # ============================================================

  feature-plan:
    name: Feature - Terraform Plan

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false

      # --------------------------------------------------------
      # CREATE PULL REQUEST
      # --------------------------------------------------------

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          BRANCH_NAME="${GITHUB_REF_NAME}"

          EXISTING_PR=$(gh pr list \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then

            echo "Pull Request #$EXISTING_PR already exists."

          else

            echo "Creating Pull Request..."

            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Terraform: ${BRANCH_NAME} -> main" \
              --body "## Terraform Infrastructure Change

          This Pull Request was automatically created by GitHub Actions.

          ### Terraform Checks

          - terraform fmt
          - terraform init
          - terraform validate
          - terraform plan

          ### Source Branch

          ${BRANCH_NAME}

          ### Target Branch

          main"

          fi


  # ============================================================
  # PR APPROVAL + AUTOMATIC MERGE
  #
  # Reviewer approves PR
  #
  #       |
  #       v
  #
  # GitHub Actions detects approval
  #
  #       |
  #       v
  #
  # Squash merge into main
  #
  #       |
  #       v
  #
  # Delete feature branch
  #
  # ============================================================

  merge-approved-pr:
    name: Merge Approved PR

    if: >
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge approved PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "PR #${PR_NUMBER} has been approved."
          echo "Merging PR into main..."

          gh pr merge "${PR_NUMBER}" \
            --squash \
            --delete-branch


  # ============================================================
  # MAIN BRANCH
  #
  # PR approved + merged
  #
  #       |
  #       v
  #
  # main push
  #
  #       |
  #       +--> Terraform fmt
  #       +--> Terraform init
  #       +--> Terraform validate
  #       +--> Terraform plan
  #       +--> Terraform apply
  #
  # ============================================================

  main-deploy:
    name: Main - Terraform Plan and Apply

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AZURE LOGIN
      # --------------------------------------------------------

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # TERRAFORM SETUP
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # TERRAFORM FORMAT
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      # --------------------------------------------------------
      # TERRAFORM INIT
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # --------------------------------------------------------
      # TERRAFORM VALIDATE
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # --------------------------------------------------------
      # TERRAFORM PLAN
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false

      # --------------------------------------------------------
      # TERRAFORM APPLY
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false