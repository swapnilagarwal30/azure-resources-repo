name: Terraform CI

on:
  push:
    branches:
      - "feature/**"

  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  actions: write
  pull-requests: write
  id-token: write

env:
  TF_WORKING_DIR: parent_module/dev

jobs:

  # ============================================================
  # FEATURE BRANCH - TERRAFORM PLAN
  # ============================================================

  feature-plan:
    name: Feature - Terraform Plan

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AZURE LOGIN
      # --------------------------------------------------------

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # TERRAFORM SETUP
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # TERRAFORM FORMAT
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      # --------------------------------------------------------
      # TERRAFORM INIT
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # --------------------------------------------------------
      # TERRAFORM VALIDATE
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # --------------------------------------------------------
      # TERRAFORM PLAN
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false

      # --------------------------------------------------------
      # CREATE PR
      # --------------------------------------------------------

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"

          echo "=========================================="
          echo "Checking for existing Pull Request"
          echo "=========================================="

          EXISTING_PR=$(gh pr list \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then

            echo "Pull Request #${EXISTING_PR} already exists."

            echo "Requesting review from prakash-vcare..."

            gh pr edit "$EXISTING_PR" \
              --add-reviewer "prakash-vcare"

            echo "Review requested successfully."

          else

            echo "No existing Pull Request found."
            echo "Creating Pull Request..."

            PR_BODY=$(cat <<'EOF'
          ## Terraform Infrastructure Change

          This Pull Request was automatically created by GitHub Actions.

          ### Terraform Checks

          - terraform fmt
          - terraform init
          - terraform validate
          - terraform plan

          ### Source Branch

          ${BRANCH_NAME}

          ### Target Branch

          main

          ### Required Reviewer

          @prakash-vcare
          EOF
          )

            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Terraform: ${BRANCH_NAME} -> main" \
              --body "$PR_BODY")

            echo "Pull Request created:"
            echo "$PR_URL"

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --json number \
              --jq '.number')

            echo "Pull Request Number: ${PR_NUMBER}"

            echo "Requesting review from prakash-vcare..."

            gh pr edit "$PR_NUMBER" \
              --add-reviewer "prakash-vcare"

            echo "Review requested successfully."

          fi


  # ============================================================
  # APPROVED PR - MERGE AND TRIGGER CD
  # ============================================================

  merge-approved-pr:
    name: Merge Approved PR

    if: github.event_name == 'pull_request_review' && github.event.action == 'submitted' && github.event.review.state == 'approved' && github.event.review.user.login == 'prakash-vcare' && github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # VERIFY REVIEWER
      # --------------------------------------------------------

      - name: Verify Reviewer Approval
        run: |
          echo "=========================================="
          echo "Pull Request Approval"
          echo "=========================================="

          echo "Pull Request: #${{ github.event.pull_request.number }}"
          echo "Reviewer: ${{ github.event.review.user.login }}"
          echo "Review State: ${{ github.event.review.state }}"

          if [ "${{ github.event.review.user.login }}" != "prakash-vcare" ]; then
            echo "ERROR: Pull Request was not approved by prakash-vcare."
            exit 1
          fi

          if [ "${{ github.event.review.state }}" != "approved" ]; then
            echo "ERROR: Pull Request is not approved."
            exit 1
          fi

          echo "Pull Request approved by prakash-vcare."


      # --------------------------------------------------------
      # MERGE APPROVED PR
      # --------------------------------------------------------

      - name: Merge Approved PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "=========================================="
          echo "Merging Pull Request"
          echo "=========================================="

          echo "PR #${PR_NUMBER} was approved by prakash-vcare."

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch

          echo "Pull Request merged successfully."


      # --------------------------------------------------------
      # TRIGGER TERRAFORM CD
      # --------------------------------------------------------

      - name: Trigger Terraform CD
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "=========================================="
          echo "Triggering Terraform CD"
          echo "=========================================="

          gh workflow run terraform-cd.yml \
            --repo prakash-vcare/azure-resources-repo \
            --ref main

          echo "Terraform CD workflow triggered successfully."